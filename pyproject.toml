[project]
name = "hr-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.3",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "mailtrap>=2.10.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff]
extend-exclude = [
    "alembic/versions",
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["INP001"]
